name: chamados-academicos

# Local environment only (NFR8): `docker compose up` builds and starts database, API and web.
# Values come from the git-ignored .env (see .env.example).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published port: the database is reachable only inside the compose network.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Required settings are validated by the API itself, which refuses to start naming the
      # missing variable (BR5.3).
      JWT_SECRET: ${JWT_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      PORT: '3000'
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy when the deny-by-default API answers 401 to the session operation: no extra
    # public route is needed for the check.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/auth/me').then((r) => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Real PostgreSQL for the integration tests. Started only with the "test" profile:
  #   docker compose --profile test up -d postgres-test
  # Its port is published on 127.0.0.1 only, so the tests running on the host can reach it.
  postgres-test:
    image: postgres:18-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:?set POSTGRES_TEST_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?set POSTGRES_TEST_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_TEST_DB:?set POSTGRES_TEST_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
